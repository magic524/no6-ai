# YOLO11 with DEGConv in DEEP backbone only (P4/P5 level)
# Hypothesis: Edge-gated features at deep semantic levels provide better
# boundary refinement for large/medium objects detected at P4/P5.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2 (original C3k2, shallow)
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4 (original C3k2, shallow)
  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 2, C3k2_DEGConv, [512, True]]        # 6 ← DEGConv (deep, P4 level)
  - [-1, 1, Conv, [1024, 3, 2]]               # 7-P5/32
  - [-1, 2, C3k2_DEGConv, [1024, True]]       # 8 ← DEGConv (deep, P5 level)
  - [-1, 1, SPPF, [1024, 5]]                  # 9
  - [-1, 2, C2PSA, [1024]]                    # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]               # 13 (original C3k2)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]               # 16 (original C3k2)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]               # 19 (original C3k2)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]               # 22 (original C3k2)

  - [[16, 19, 22], 1, Detect, [nc]]
