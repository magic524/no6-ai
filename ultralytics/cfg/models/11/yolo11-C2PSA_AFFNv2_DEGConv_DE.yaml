# YOLO11 — C2PSA_AFFNv2 + DEGConv_DE 组合模型
# 替换项：
#   C3k2 → C3k2_DEGConv_DE（所有 backbone + head 特征提取块）
#   C2PSA → C2PSA_AFFNv2（Layer 10，频域自相关调制 PSA）

# Parameters
nc: 80 # override at train time via data YAML
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2_DEGConv_DE, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2_DEGConv_DE, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2_DEGConv_DE, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2_DEGConv_DE, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA_AFFNv2, [1024]]              # 10 — AFFNv2

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                  # cat backbone P4
  - [-1, 2, C3k2_DEGConv_DE, [512, False]]     # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                  # cat backbone P3
  - [-1, 2, C3k2_DEGConv_DE, [256, False]]     # 16 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]                 # cat head P4
  - [-1, 2, C3k2_DEGConv_DE, [512, False]]     # 19 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]                 # cat head P5
  - [-1, 2, C3k2_DEGConv_DE, [1024, True]]     # 22 (P5/32-large)
  - [[16, 19, 22], 1, Detect, [nc]]            # Detect(P3, P4, P5)